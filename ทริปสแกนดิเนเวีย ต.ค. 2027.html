<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#10262e;--mut:#56686f;--line:#d5dde0;--a:#0a8f7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c21;--card:#17282e;--ink:#e6eef0;--mut:#9db0b6;--line:#2a3f46}}
:root[data-theme="dark"]{--bg:#0f1c21;--card:#17282e;--ink:#e6eef0;--mut:#9db0b6;--line:#2a3f46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Sarabun,"Noto Sans Thai",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
header{padding:20px 16px 8px;max-width:720px;margin:auto}
h1{font:800 26px/1.3 "Noto Serif Thai",serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px 14px;border-radius:20px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
main{max-width:720px;margin:auto;padding:12px 16px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px;color:var(--mut)}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.note{border-left:4px solid var(--a);background:var(--card);padding:10px 14px;border-radius:4px;margin:0 0 12px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
summary{padding:12px 14px;cursor:pointer;font:600 17px/1.4 "Noto Serif Thai",serif}
summary:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
ul.d{list-style:none;margin:0;padding:0 14px 12px}
ul.d li{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
ul.d b{color:var(--a)}
.relax .x{display:none}
.x i{font-style:normal;color:var(--mut)}
h2{font:600 18px "Noto Serif Thai",serif;margin:22px 0 8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.ck input{margin-top:6px;width:18px;height:18px}
.ck input:checked+span{text-decoration:line-through;color:var(--mut)}
.prog{color:var(--mut);margin:0 0 6px}
.wx{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}.wx svg{display:block;width:100%;height:64px;color:var(--a);background:linear-gradient(var(--bg),var(--card))}.wx dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:10px 14px}.wx dt{color:var(--mut);font-size:13px}.wx dd{margin:0;font-weight:600}.wx p{margin:0;padding:0 14px 10px;color:var(--mut);font-size:14px}
</style></head><body>

const C=["วีซ่า Schengen ทั้ง 3 คน (ยื่นกับสถานทูตเดนมาร์ก)","SG Arrival Card (ขาไปและขากลับ) 3 วันก่อนเข้า","ตั๋วรถไฟ CPH → Stockholm (SJ)","ตั๋วรถไฟ Stockholm → Oslo (SJ)","เรือ DFDS Oslo → Copenhagen (ห้องมีหน้าต่าง)","โรงแรม: CPH 3 คืน (เริ่ม 16 ต.ค.) · STO 4 คืน · OSL 4 คืน · CPH 1 คืน","เลือกที่นั่ง/อาหารพิเศษของ SQ ทาง Manage Booking","ประกันการเดินทางที่ครอบคลุมสุขภาพ","ซิม/eSIM ยุโรป","เสื้อกันหนาว ร่ม รองเท้ากันน้ำ (อากาศราว 3–12°C มืดก่อน 18:00)"];
const $=s=>document.querySelector(s);let cur=0;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function render(){
 $("#nav").innerHTML=S.map((s,i)=>`<button aria-pressed="${i==cur}" data-i="${i}">${s.n}</button>`).join("")+`<button aria-pressed="${cur==99}" data-i="99">เตรียมก่อนไป</button>`;

 if(cur==99){

  const pg=()=>$("#pg").textContent="เสร็จแล้ว "+document.querySelectorAll(".ck input:checked").length+" จาก "+C.length;pg();
  m.querySelectorAll("input").forEach(e=>e.onchange=()=>{store("ck",JSON.stringify([...document.querySelectorAll(".ck input")].map((x,i)=>x.checked?i:-1).filter(i=>i>=0)));pg()});
  return}

 m.innerHTML=`<div class="bar"><span>${s.days.length} วัน</span><label><input type="checkbox" id="rx" ${m.classList.contains("relax")||cur>=0&&relax?"checked":""}> โหมดผ่อน ซ่อนกิจกรรมเสริม</label></div>${wx(cur)}<p class="note">${s.note}</p>`+
 s.days.map((d,j)=>`<details ${j==0?"open":""}><summary>${d.h}</summary><ul class="d">${d.i.map(r=>`<li class="${r[2]?"x":""}"><b>${r[0]}</b><span>${r[1]}${r[2]?" <i>(เสริม)</i>":""}</span></li>`).join("")}</ul></details>`).join("");
 m.classList.toggle("relax",relax);
 $("#rx").onchange=e=>{relax=e.target.checked;m.classList.toggle("relax",relax)}}
const A=[`<rect x="70" y="24" width="14" height="40"/><rect x="92" y="24" width="14" height="40"/><rect x="114" y="24" width="14" height="40"/><path d="M62 20h74v6H62z"/><path d="M180 64l8-34 8 34zM208 64l8-40 8 40zM236 64l8-34 8 34z"/>`,`<path d="M50 64V34l7-26 7 26v30zM110 64V38h26v26zM140 64V30l7-22 7 22v34zM200 64V40h34v24z"/><path d="M262 64V28l6-20 6 20v36z"/>`,`<path d="M60 64V24h20v40zM64 24l6-14 6 14zM110 64V40l14-12 14 12v24zM150 64V36l14-10 14 10v28zM200 64V44h40v20z"/>`,`<path d="M40 64l60-34 80 34zM190 64V32h14v32zM220 64V42h14v22zM250 64V36h14v28z"/>`,`<path d="M40 64h200l20-22H70zM120 42V24h40v18zM190 42V30h20v12z"/>`];
const W=[["25–31°C","ฝนฟ้าคะนองบ่ายบ่อย","ตก ~19:00","ร้อนชื้น พกร่มและเสื้อบาง ในห้างห้องแอร์เย็นจัด"],["6–13°C","ฝนปรอยราว 1 ใน 2 วัน","ตก 18:10→17:30","ลมเย็น ใส่เลเยอร์ + เสื้อกันลมกันน้ำ ไม่ต้องใส่โค้ทหนา"],["2–9°C","ฝนเล็กน้อย บางวันหมอก","ตก ~17:30","หนาวกว่าโคเปนฯ ใส่ฮีทเทค ถุงมือ หมวกไหมพรม"],["1–8°C","ฝนหรือฝนปนหิมะเบาๆ","ตก ~17:10","หนาวสุดของทริป พื้นลื่น ใส่รองเท้ากันน้ำพื้นกันลื่น"],["6–10°C","ลมแรงบนดาดฟ้า","ตก ~17:30","ช่วงออกจากฟยอร์ดน่าดู อยู่ในเรือส่วนใหญ่ พกยาแก้เมาเรือไว้"],["25–31°C","ฝนฟ้าคะนองบ่ายบ่อย","ตก ~19:00","กลับมาร้อนชื้น ถอดเลเยอร์ที่สนามบินได้เลย"]];
function wx(i){const w=W[i];return `<div class="wx"><svg viewBox="0 0 300 64" preserveAspectRatio="xMidYMax slice" fill="currentColor" aria-hidden="true">${A[i>4?0:i]}</svg><dl><div><dt>อุณหภูมิ</dt><dd>${w[0]}</dd></div><div><dt>ฝน</dt><dd>${w[1]}</dd></div><div><dt>พระอาทิตย์</dt><dd>${w[2]}</dd></div></dl><p>${w[3]} (ค่าเฉลี่ยปลาย ต.ค. โดยประมาณ ดูพยากรณ์จริงก่อนเดินทาง 1 สัปดาห์)</p></div>`}

</script></body></html>
